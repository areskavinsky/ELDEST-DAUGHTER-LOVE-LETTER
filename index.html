<!DOCTYPE html>

  <style>
    :root {

      --muted: #77716b;
      --line: #d2c8bf;

      --accent: #bd6652;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    }
    .page-inner {
      width: min(700px, calc(100vw - clamp(58px, 32vw, 430px)));

    .view { animation: enter .42s ease both; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 10;
      padding: 7px 10px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;

      font-weight: 700;
      letter-spacing: .16em;
      line-height: 1.5;
      text-transform: uppercase;
      white-space: nowrap;

      font-weight: 700;
      letter-spacing: .16em;
      line-height: 1.4;

    h1, h2 { font-family: var(--serif); font-weight: normal; }

    .chapter-title,

      letter-spacing: -.075em;

    .accent {
      display: block;

    }

</head>

          letter: `Katanya, memenangkan hati seorang anak perempuan sulung bukanlah hal yang mudah. Kamu mandiri, tahu apa yang kamu inginkan, dan sudah belajar membangun kehidupanmu sendiri. Kamu adalah perempuan yang tahu bagaimana caranya terus melangkah, bahkan ketika sebenarnya kamu membutuhkan waktu sejenak untuk menarik napas.

          letter: `Menurutku, salah satu hal indah dari mengenal seseorang adalah menyadari bahwa cinta bukan berarti kita harus mengubahnya menjadi sosok yang kita inginkan.

    /* Tempel URL Web App Google Apps Script di sini jika sudah dideploy. */
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySKVyGHWU0VcortMc0yotW2lTq3PsSGvRxMaUMHOBUYNTUbbdnzvelPbC7wxXsvGdflQ/exec';
    const state = { view: 'cover', lovePercent: 50 };
    const app = document.querySelector('#app');
    const modal = document.querySelector('#contentsModal');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }
    function renderLetter(value) {
      return escapeHTML(value)
        .replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>')
        .replace(/\*([^*]+?)\*/gs, '<em>$1</em>');
    }
    function openView(view) {
      state.view = view;
      closeContents();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function goCover() { openView('cover'); }
    function goChapter(index) { openView(index); }
    function goQuestion() { openView('question'); }
    function goMessage() { openView('message'); }
    function bookMarker(pageNumber) {
      const pageText = pageNumber === 0 ? 'cover' : pageNumber + ' / 7';
      return `<div class="topline"><span class="topline-title">${String(pageNumber).padStart(2, '0')} / THE ART OF WINNING AN ELDEST DAUGHTER'S HEART</span><span class="topline-page">${pageText}</span></div><div class="rule"></div>`;
    }

    function renderCover() {
      app.innerHTML = `<section class="view">
        ${bookMarker(0)}
        <p class="eyebrow">A LITTLE PLACE TO BREATHE</p>
        <h1 class="hero-title">Winning her heart<br><span class="accent">is an art.</span></h1>
        <p class="intro-copy">${escapeHTML(BOOK.subtitle)}</p>
        <p class="byline">Hello, ${escapeHTML(BOOK.recipient)}.<br>Made with love, by ${escapeHTML(BOOK.author)}.</p>
        <button class="primary-button" id="openStory" type="button">Open our story ↗</button>
        <p class="cover-note">take your time · 7 parts · made slowly</p>
      </section>`;
      document.querySelector('#openStory').addEventListener('click', () => goChapter(0));
    }

    function renderChapter(index) {
      const chapter = BOOK.chapters[index];
      const letter = String(chapter.letter || '').trim();
      app.innerHTML = `<section class="view">
        ${bookMarker(index + 1)}
        <p class="eyebrow">${escapeHTML(chapter.label)}</p>
        <h1 class="chapter-title">${escapeHTML(chapter.title)}</h1>
        <p class="chapter-theme">${escapeHTML(chapter.theme)}</p>
        <div class="letter-area">
          <div class="letter-text ${letter ? '' : 'empty'}">${renderLetter(letter || chapter.placeholder)}</div>
        </div>
        <nav class="page-nav" aria-label="Chapter navigation">
          <button class="secondary-button" id="previousButton" type="button">← ${index === 0 ? 'Beginning' : 'Previous part'}</button>
          <button class="primary-button" id="nextButton" type="button">${index === BOOK.chapters.length - 1 ? 'One last question →' : 'Next part →'}</button>
        </nav>
      </section>`;
      document.querySelector('#previousButton').addEventListener('click', () => index === 0 ? goCover() : goChapter(index - 1));
      document.querySelector('#nextButton').addEventListener('click', () => index === BOOK.chapters.length - 1 ? goQuestion() : goChapter(index + 1));
    }

    function renderQuestion() {
      app.innerHTML = `<section class="view">
        ${bookMarker(8)}
        <p class="eyebrow">A QUESTION FOR YOU</p>
        <h1 class="special-title">How much do you<br><span class="accent">love me?</span></h1>
        <p class="special-copy">Kalau boleh jujur, berapa persen kamu cinta sama aku?</p>
        <div class="answer-box">
          <span class="answer-percent" id="answerPercent">${state.lovePercent}%</span>
          <label class="sr-only" for="loveRange">Persentase cinta</label>
          <input class="love-range" id="loveRange" type="range" min="0" max="100" value="${state.lovePercent}">
          <label class="sr-only" for="loveNumber">Persentase cinta dalam angka</label>
          <input class="love-number" id="loveNumber" type="number" min="0" max="100" value="${state.lovePercent}"> %
        </div>
        <div class="special-actions">
          <button class="secondary-button" id="questionBack" type="button">← Back to part 07</button>
          <button class="primary-button" id="questionNext" type="button">Continue to your message ↗</button>
        </div>
      </section>`;
      const range = document.querySelector('#loveRange');
      const number = document.querySelector('#loveNumber');
      const percent = document.querySelector('#answerPercent');
      function update(value) {
        state.lovePercent = Math.max(0, Math.min(100, Number(value) || 0));
        range.value = state.lovePercent;
        number.value = state.lovePercent;
        percent.textContent = state.lovePercent + '%';
      }
      range.addEventListener('input', event => update(event.target.value));
      number.addEventListener('input', event => update(event.target.value));
      document.querySelector('#questionBack').addEventListener('click', () => goChapter(6));
      document.querySelector('#questionNext').addEventListener('click', goMessage);
    }

    function renderMessage() {
      app.innerHTML = `<section class="view">
        ${bookMarker(9)}
        <p class="eyebrow">ONE MORE THING</p>
        <h1 class="special-title">Anything you want<br><span class="accent">to tell me?</span></h1>
        <p class="special-copy">Kalau ada kata-kata yang ingin kamu ucapkan ke aku, tulis di sini.</p>
        <p class="status">Jawaban ini akan disimpan ke Google Sheet milik Bayu.</p>
        <textarea class="message-box" id="messageInput" maxlength="1000" placeholder="Tulis pesanmu di sini..."></textarea>
        <p class="status" id="messageStatus"></p>
        <div class="special-actions">
          <button class="secondary-button" id="messageBack" type="button">← Back to question</button>
          <button class="primary-button" id="saveAnswer" type="button">Save your answer ↗</button>
        </div>
      </section>`;
      document.querySelector('#messageBack').addEventListener('click', goQuestion);
      document.querySelector('#saveAnswer').addEventListener('click', async () => {
        const input = document.querySelector('#messageInput');
        const status = document.querySelector('#messageStatus');
        const button = document.querySelector('#saveAnswer');
        const message = input.value.trim();
        if (!message) { status.textContent = 'Tulis pesannya dulu ya.'; input.focus(); return; }
        if (!GOOGLE_SCRIPT_URL) { status.textContent = 'Google Sheets belum dikonfigurasi.'; return; }
        button.disabled = true;
        button.textContent = 'Saving...';
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ percent: state.lovePercent, message })
          });
          status.textContent = 'Permintaan penyimpanan sudah dikirim. Cek Google Sheets untuk konfirmasi.';
          button.textContent = 'Sent ✓';
          input.value = '';
        } catch (error) {
          status.textContent = 'Belum terkirim. Cek koneksi atau URL Apps Script.';
          button.disabled = false;
          button.textContent = 'Save your answer ↗';
        }
      });
    }

    function render() {
      if (state.view === 'cover') renderCover();
      else if (typeof state.view === 'number') renderChapter(state.view);
      else if (state.view === 'question') renderQuestion();
      else renderMessage();
    }

    function openContents() {
      document.querySelector('#contentsList').innerHTML = BOOK.chapters.map((chapter, index) => `<li><button type="button" data-index="${index}"><span>${String(index + 1).padStart(2, '0')}</span>${escapeHTML(chapter.indexLabel)}</button></li>`).join('');
      document.querySelectorAll('#contentsList button').forEach(button => button.addEventListener('click', () => goChapter(Number(button.dataset.index))));
      modal.classList.add('open');
    }
    function closeContents() { modal.classList.remove('open'); }

    document.querySelector('#indexButton').addEventListener('click', openContents);
    document.querySelector('#closeContents').addEventListener('click', closeContents);
    modal.addEventListener('click', event => { if (event.target === modal) closeContents(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeContents();
      if (typeof state.view !== 'number') return;
      if (event.key === 'ArrowLeft') state.view > 0 ? goChapter(state.view - 1) : goCover();
      if (event.key === 'ArrowRight') state.view < BOOK.chapters.length - 1 ? goChapter(state.view + 1) : goQuestion();
    });

    render();
  </script>
